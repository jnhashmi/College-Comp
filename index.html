<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marina’s college comparison worksheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #2d1b30;
    --ink-soft: #6e5470;
    --paper: #f5f5f6;
    --field: #fadbe8;
    --card: #fff3f8;
    --line: #e5b3cb;
    --sea: #c2457d;
    --sea-hover: #a3326a;
    --sea-wash: #f6c6da;
    --sun: #4a2350;
    --danger: #a31d4f;
    --header-bg: #dccdf2;
    --radius: 10px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #fbe9f2;
      --ink-soft: #cfa8bf;
      --paper: #1a1a1b;
      --field: #2a1522;
      --card: #38202f;
      --line: #5c3a52;
      --sea: #b8437a;
      --sea-hover: #9c2f64;
      --sea-wash: #4b2b3f;
      --sun: #f3d6ec;
      --danger: #ff9cc0;
      --header-bg: #3b2d58;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --ink: #fbe9f2;
    --ink-soft: #cfa8bf;
    --paper: #1a1a1b;
    --field: #2a1522;
    --card: #38202f;
    --line: #5c3a52;
    --sea: #b8437a;
    --sea-hover: #9c2f64;
    --sea-wash: #4b2b3f;
    --sun: #f3d6ec;
    --danger: #ff9cc0;
    --header-bg: #3b2d58;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { background: var(--paper); }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
    font-size: 17px;
    line-height: 1.5;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  h1, h2 {
    font-family: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
  }
  header.top {
    background: var(--header-bg);
    color: var(--ink);
    padding: 1.4rem 1.25rem;
  }
  .wrap { max-width: 1100px; margin: 0 auto; }
  header.top h1 { font-size: clamp(1.35rem, 3.2vw, 1.8rem); line-height: 1.15; }
  .toolbar {
    position: sticky; top: 0; z-index: 5;
    background: color-mix(in srgb, var(--paper) 92%, transparent);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--line);
    padding: .6rem 1.25rem;
    padding-top: calc(.6rem + env(safe-area-inset-top, 0px));
  }
  .toolbar .wrap { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; justify-content: space-between; }
  .tabs { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--card); }
  .tabs button {
    border: 0; background: transparent; color: var(--ink-soft);
    font: inherit; font-weight: 600; padding: .45rem 1.1rem; cursor: pointer;
  }
  .tabs button[aria-selected="true"] { background: var(--sea); color: #fff; }
  .actions { display: flex; flex-wrap: wrap; gap: .4rem; }
  .btn {
    font: inherit; font-weight: 600; cursor: pointer;
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    padding: .42rem .9rem; border-radius: 8px;
  }
  .btn:hover { border-color: var(--sea); }
  .btn.primary { background: var(--sea); border-color: var(--sea); color: #fff; }
  .btn.primary:hover { background: var(--sea-hover); }
  .btn.danger { color: var(--danger); }
  .btn.link {
    border: 0; background: none; padding: .42rem .3rem; font-weight: 400;
    color: var(--ink); text-decoration: underline; text-underline-offset: 3px;
  }
  .btn.link:hover { color: var(--ink-soft); }
  .actions { align-items: center; gap: .4rem .9rem; }
  :focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }

  main { padding: 0 1.25rem 4rem; }
  .saved { font-size: .9rem; color: var(--ink-soft); margin: 1rem 0 0; min-height: 1.4em; }

  .college {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 1.25rem;
    margin: 1.1rem 0;
    box-shadow: 0 1px 0 var(--line);
  }
  .college-head { display: flex; gap: .75rem; align-items: flex-end; justify-content: space-between; margin-bottom: 1rem; }
  .college-head .name-field { flex: 1; }
  .grid { display: grid; gap: 1rem 1.25rem; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
  .span-2 { grid-column: 1 / -1; }
  fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
  label, legend { display: block; font-weight: 600; font-size: .95rem; margin-bottom: .3rem; padding: 0; }
  .hint { font-weight: 400; color: var(--ink-soft); font-size: .88rem; }
  input[type="text"], input[type="date"], textarea {
    width: 100%; font: inherit; color: var(--ink);
    background: var(--field); border: 1px solid var(--line); border-radius: 8px;
    padding: .5rem .65rem;
  }
  textarea { resize: vertical; min-height: 5.2rem; }
  input[type="text"]:focus, input[type="date"]:focus, textarea:focus { border-color: var(--sea); outline: 3px solid var(--sea-wash); }
  .name-field input { font-family: "Bricolage Grotesque", system-ui, sans-serif; font-weight: 700; font-size: 1.35rem; }

  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--field); }
  .seg label { margin: 0; font-weight: 600; position: relative; }
  .seg input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
  .seg span { display: block; padding: .42rem .9rem; color: var(--ink-soft); }
  .seg label + label span { border-left: 1px solid var(--line); }
  .seg input:checked + span { background: var(--sea); color: #fff; }
  .seg input[data-diff="Hard"]:checked + span { background: var(--sun); color: var(--paper); }
  .seg input:focus-visible + span { outline: 3px solid var(--sun); outline-offset: -3px; }

  .empty { text-align: center; padding: 3rem 1rem; color: var(--ink-soft); }

  .table-scroll { overflow-x: auto; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); margin-top: 1.1rem; }
  table { border-collapse: collapse; width: 100%; min-width: 980px; font-size: .95rem; }
  th, td { text-align: left; vertical-align: top; padding: .6rem .75rem; border-bottom: 1px solid var(--line); }
  th { font-family: "Bricolage Grotesque", system-ui, sans-serif; font-size: .9rem; background: var(--sea-wash); color: var(--ink); position: sticky; top: 0; }
  td:first-child, th:first-child { position: sticky; left: 0; background: var(--card); font-weight: 600; border-right: 1px solid var(--line); }
  th:first-child { background: var(--sea-wash); }
  td.long { min-width: 190px; white-space: pre-wrap; }
  th:nth-child(2), td:nth-child(2) { width: 5.1rem; min-width: 5.1rem; max-width: 5.1rem; }
  .pill { display: inline-block; padding: 0 .55rem; border-radius: 999px; font-weight: 600; font-size: .85rem; background: var(--sea-wash); color: var(--ink); }
  .pill.hard { background: var(--sun); color: var(--paper); }
  .muted { color: var(--ink-soft); }

  .gate { width: min(460px, calc(100% - 2.5rem)); margin: 3rem auto; padding: 1.75rem; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); text-align: center; }
  .gate h2 { font-size: 1.3rem; margin-bottom: .6rem; }
  .gate p { margin: 0 0 1.1rem; color: var(--ink-soft); }
  .gate p:last-child { margin-bottom: 0; }
  .gate .gate-error { color: var(--danger); margin-top: 1rem; }
  .gate code { background: var(--field); padding: 0 .3rem; border-radius: 4px; }

  [hidden] { display: none !important; }

  @media print {
    .gate, .toolbar, .saved, .btn { display: none !important; }
    header.top { background: none; color: #000; padding: 0 0 1rem; }
    header.top p { color: #333; }
    main { margin-top: 0; }
    body { background: #fff; color: #000; font-size: 12px; }
    .college { break-inside: avoid; box-shadow: none; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .btn, .tabs button { transition: background-color .15s, border-color .15s; }
  }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <h1>Marina’s college comparison worksheet</h1>
  </div>
</header>

<section class="gate" id="gate" aria-live="polite"><p>Loading…</p></section>

<div class="toolbar" id="toolbar" hidden>
  <div class="wrap">
    <div class="tabs" role="tablist" aria-label="Views">
      <button role="tab" id="tab-compare" aria-selected="true" aria-controls="view-compare">Compare</button>
      <button role="tab" id="tab-edit" aria-selected="false" aria-controls="view-edit">Fill in</button>
    </div>
    <div class="actions">
      <button class="btn primary" id="add">Add college</button>
      <button class="btn link" id="csv">Download CSV</button>
      <button class="btn link" id="print">Print</button>
      <button class="btn link" id="signout">Sign out</button>
    </div>
  </div>
</div>

<main id="main" hidden>
  <div class="wrap">
    <p class="saved" id="status" role="status" aria-live="polite"></p>

    <section id="view-compare" role="tabpanel" aria-labelledby="tab-compare">
      <div id="compare"></div>
    </section>

    <section id="view-edit" role="tabpanel" aria-labelledby="tab-edit" hidden>
      <div id="cards"></div>
    </section>
  </div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {
  initializeFirestore, getFirestore, persistentLocalCache, persistentMultipleTabManager,
  collection, doc, setDoc, updateDoc, deleteDoc, onSnapshot, query, orderBy
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

/* ------------------------------------------------------------------
   Firebase settings for this project.
   ------------------------------------------------------------------ */
const firebaseConfig = {
  apiKey: "AIzaSyDBTaTCn1aJsRqGlXpCaye3SWpGJ2YrIok",
  authDomain: "college-comparison.firebaseapp.com",
  projectId: "college-comparison",
  storageBucket: "college-comparison.firebasestorage.app",
  messagingSenderId: "983230247659",
  appId: "1:983230247659:web:6ab868cc5ce839e0fa44ae"
};
/* ------------------------------------------------------------------ */

var FIELDS = [
  { key: "name",    label: "College name" },
  { key: "type",    label: "4-yr / 2-yr" },
  { key: "local",   label: "LA local" },
  { key: "ocean",   label: "Near ocean" },
  { key: "diff",    label: "App difficulty" },
  { key: "due",     label: "App due" },
  { key: "major",   label: "Must declare major" },
  { key: "support", label: "Social / emotional / executive function support" },
  { key: "cost",    label: "Cost & merit aid available" },
  { key: "housing", label: "Housing" },
  { key: "notes",   label: "Campus culture and vibe; notes" }
];

var $ = function (id) { return document.getElementById(id); };
var gateEl = $("gate"), toolbarEl = $("toolbar"), mainEl = $("main"), cardsEl = $("cards");

var colleges = [];
var currentView = "compare";
var focusAfterAdd = null;
var pending = {};
var statusTimer = null;
var auth = null, db = null, unsub = null;

function blankFields() {
  var o = {};
  FIELDS.forEach(function (f) { o[f.key] = ""; });
  return o;
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

function say(msg, sticky) {
  var el = $("status");
  el.textContent = msg;
  clearTimeout(statusTimer);
  if (!sticky) statusTimer = setTimeout(function () { el.textContent = ""; }, 2500);
}

/* ---------- Gate (loading / sign-in / no access / setup) ---------- */

function showGate(html) {
  gateEl.innerHTML = html;
  gateEl.hidden = false;
  toolbarEl.hidden = true;
  mainEl.hidden = true;
}
function openApp() {
  gateEl.hidden = true;
  toolbarEl.hidden = false;
  mainEl.hidden = false;
}
function signedOutHtml(msg) {
  return '<h2>Sign in to open the worksheet</h2>' +
    '<p>Use the Google account that has been given access.</p>' +
    '<button class="btn primary" data-action="signin">Sign in with Google</button>' +
    (msg ? '<p class="gate-error" role="alert">' + esc(msg) + '</p>' : '');
}
function deniedHtml(email) {
  return '<h2>This account doesn’t have access</h2>' +
    '<p>You’re signed in as <strong>' + esc(email) + '</strong>. Sign in with the Google account that has been given access.</p>' +
    '<button class="btn primary" data-action="switch">Use a different account</button>';
}
function errorHtml(msg) {
  return '<h2>Something went wrong</h2><p>' + esc(msg) + '</p>' +
    '<button class="btn primary" data-action="reload">Try again</button>';
}
var setupHtml = '<h2>One setup step left</h2>' +
  '<p>Paste your Firebase settings into <code>firebaseConfig</code> at the top of the script in index.html, then reload this page.</p>';

gateEl.addEventListener("click", function (e) {
  var b = e.target.closest("[data-action]");
  if (!b) return;
  var a = b.getAttribute("data-action");
  if (a === "signin") signIn();
  if (a === "switch") signOut(auth);
  if (a === "reload") location.reload();
});

async function signIn() {
  var provider = new GoogleAuthProvider();
  provider.setCustomParameters({ prompt: "select_account" });
  try {
    await signInWithPopup(auth, provider);
  } catch (e) {
    var code = e && e.code;
    if (code === "auth/popup-closed-by-user" || code === "auth/cancelled-popup-request") return;
    var msg = "Sign-in didn’t finish. Please try again.";
    if (code === "auth/popup-blocked") msg = "Your browser blocked the sign-in window. Allow pop-ups for this site and try again.";
    if (code === "auth/unauthorized-domain") msg = "This site’s address hasn’t been added to Firebase’s authorized domains yet.";
    showGate(signedOutHtml(msg));
  }
}

/* ---------- Cards (Fill in tab) ---------- */

function seg(id, key, options, current, isDiff) {
  return '<div class="seg">' + options.map(function (opt) {
    var val = typeof opt === "string" ? opt : opt[0];
    var text = typeof opt === "string" ? opt : opt[1];
    return '<label><input type="radio" name="' + esc(key + "-" + id) + '" data-key="' + key + '" value="' + esc(val) + '"' +
      (isDiff ? ' data-diff="' + esc(val) + '"' : "") +
      (current === val ? " checked" : "") + '><span>' + esc(text) + '</span></label>';
  }).join("") + "</div>";
}

function cardHtml(c) {
  var id = c.id;
  return '' +
  '<article class="college" data-id="' + esc(id) + '" aria-label="College">' +
    '<div class="college-head">' +
      '<div class="name-field"><label for="name-' + esc(id) + '">College name</label>' +
      '<input type="text" id="name-' + esc(id) + '" data-key="name" value="' + esc(c.name) + '" placeholder="e.g. Loyola Marymount"></div>' +
      '<button class="btn danger" data-remove aria-label="Remove this college">Remove</button>' +
    '</div>' +
    '<div class="grid">' +
      '<fieldset><legend>4-year or 2-year</legend>' + seg(id, "type", ["4-yr", "2-yr"], c.type) + '</fieldset>' +
      '<fieldset><legend>LA local</legend>' + seg(id, "local", [["Y", "Yes"], ["N", "No"]], c.local) + '</fieldset>' +
      '<fieldset><legend>Near ocean</legend>' + seg(id, "ocean", [["Y", "Yes"], ["N", "No"]], c.ocean) + '</fieldset>' +
      '<fieldset><legend>Application difficulty</legend>' + seg(id, "diff", [["Easy", "Easy"], ["Med", "Medium"], ["Hard", "Hard"]], c.diff, true) + '</fieldset>' +
      '<div><label for="due-' + esc(id) + '">Application due</label>' +
        '<input type="date" id="due-' + esc(id) + '" data-key="due" value="' + esc(c.due) + '"></div>' +
      '<fieldset><legend>Must declare a major</legend>' + seg(id, "major", [["Y", "Yes"], ["N", "No"]], c.major) + '</fieldset>' +
      '<div class="span-2"><label for="support-' + esc(id) + '">Social, emotional &amp; executive function support</label>' +
        '<textarea id="support-' + esc(id) + '" data-key="support" placeholder="Advising, coaching, counseling, learning center…">' + esc(c.support) + '</textarea></div>' +
      '<div><label for="cost-' + esc(id) + '">Cost &amp; merit aid available</label>' +
        '<textarea id="cost-' + esc(id) + '" data-key="cost" placeholder="Tuition, scholarships, aid estimate…">' + esc(c.cost) + '</textarea></div>' +
      '<div><label for="housing-' + esc(id) + '">Housing</label>' +
        '<textarea id="housing-' + esc(id) + '" data-key="housing" placeholder="Dorm options, guaranteed years, off-campus…">' + esc(c.housing) + '</textarea></div>' +
      '<div class="span-2"><label for="notes-' + esc(id) + '">Campus culture and vibe; notes</label>' +
        '<textarea id="notes-' + esc(id) + '" data-key="notes" placeholder="How did it feel? Who did you meet? What stood out?">' + esc(c.notes) + '</textarea></div>' +
    '</div>' +
  '</article>';
}

function hasPending(id, key) {
  return !!(pending[id] && Object.prototype.hasOwnProperty.call(pending[id].fields, key));
}

function updateCard(node, c) {
  node.querySelectorAll("[data-key]").forEach(function (el) {
    var key = el.getAttribute("data-key");
    if (hasPending(c.id, key)) return;
    if (el.type === "radio") { el.checked = (el.value === c[key]); return; }
    if (el === document.activeElement) return;
    if (el.value !== c[key]) el.value = c[key];
  });
}

/* Keeps the cards in step with the database without rebuilding
   (and without stealing focus from whatever is being typed). */
function syncCards() {
  var oldEmpty = cardsEl.querySelector(".empty");
  if (oldEmpty) oldEmpty.remove();

  if (!colleges.length) {
    cardsEl.innerHTML = '<div class="empty">No colleges yet. Choose Add college to start your list.</div>';
    return;
  }

  var ids = {};
  colleges.forEach(function (c) { ids[c.id] = true; });
  Array.prototype.slice.call(cardsEl.querySelectorAll(".college")).forEach(function (n) {
    if (!ids[n.getAttribute("data-id")]) n.remove();
  });

  colleges.forEach(function (c, i) {
    var node = null;
    Array.prototype.forEach.call(cardsEl.querySelectorAll(".college"), function (n) {
      if (n.getAttribute("data-id") === c.id) node = n;
    });
    if (node) {
      updateCard(node, c);
    } else {
      var t = document.createElement("div");
      t.innerHTML = cardHtml(c);
      node = t.firstElementChild;
      cardsEl.insertBefore(node, cardsEl.children[i] || null);
      if (focusAfterAdd === c.id) {
        focusAfterAdd = null;
        var input = node.querySelector('[data-key="name"]');
        if (input) { input.scrollIntoView({ block: "center" }); input.focus(); }
      }
    }
  });
}

/* ---------- Compare tab ---------- */

function yn(v) { return v === "Y" ? "Yes" : v === "N" ? "No" : '<span class="muted">–</span>'; }
function txt(v) { return v ? esc(v) : '<span class="muted">–</span>'; }
function fmtDate(v) {
  if (!v) return '<span class="muted">–</span>';
  var p = v.split("-");
  if (p.length !== 3) return esc(v);
  var d = new Date(+p[0], +p[1] - 1, +p[2]);
  return esc(d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }));
}

function renderCompare() {
  var el = $("compare");
  if (!colleges.length) {
    el.innerHTML = '<div class="empty">No colleges yet. Choose Add college to start your list.</div>';
    return;
  }
  var head = '<tr>' + FIELDS.map(function (f) { return '<th scope="col">' + esc(f.label) + '</th>'; }).join("") + '</tr>';
  var rows = colleges.map(function (c) {
    var diff = c.diff ? '<span class="pill' + (c.diff === "Hard" ? " hard" : "") + '">' + esc(c.diff === "Med" ? "Medium" : c.diff) + '</span>' : '<span class="muted">–</span>';
    return '<tr>' +
      '<th scope="row" style="font-weight:600;background:var(--card);font-family:inherit;font-size:inherit">' + (c.name ? esc(c.name) : '<span class="muted">Untitled</span>') + '</th>' +
      '<td>' + (c.type ? esc(c.type) : '<span class="muted">–</span>') + '</td>' +
      '<td>' + yn(c.local) + '</td>' +
      '<td>' + yn(c.ocean) + '</td>' +
      '<td>' + diff + '</td>' +
      '<td>' + fmtDate(c.due) + '</td>' +
      '<td>' + yn(c.major) + '</td>' +
      '<td class="long">' + txt(c.support) + '</td>' +
      '<td class="long">' + txt(c.cost) + '</td>' +
      '<td class="long">' + txt(c.housing) + '</td>' +
      '<td class="long">' + txt(c.notes) + '</td>' +
    '</tr>';
  }).join("");
  el.innerHTML = '<div class="table-scroll"><table><caption class="muted" style="text-align:left;padding:.6rem .75rem;caption-side:bottom">Edit details on the Fill in tab.</caption><thead>' + head + '</thead><tbody>' + rows + '</tbody></table></div>';
}

/* ---------- Saving to the shared database ---------- */

function findCollege(id) {
  for (var i = 0; i < colleges.length; i++) if (colleges[i].id === id) return colleges[i];
  return null;
}

function queueWrite(id, key, value, delay) {
  var c = findCollege(id);
  if (c) c[key] = value;
  var p = pending[id] || (pending[id] = { fields: {}, timer: null });
  p.fields[key] = value;
  clearTimeout(p.timer);
  p.timer = setTimeout(function () { flush(id); }, delay);
  say("Saving…", true);
}

async function flush(id) {
  var p = pending[id];
  if (!p) return;
  clearTimeout(p.timer);
  var fields = p.fields;
  delete pending[id];
  try {
    await updateDoc(doc(db, "colleges", id), fields);
    if (!Object.keys(pending).length) say("Saved for everyone");
  } catch (e) {
    say("Couldn’t save that change. Check your connection.");
  }
}

function flushAll() { Object.keys(pending).forEach(flush); }
window.addEventListener("pagehide", flushAll);
document.addEventListener("visibilitychange", function () { if (document.hidden) flushAll(); });

function handleField(e, delay) {
  var t = e.target;
  var key = t.getAttribute("data-key");
  var card = t.closest(".college");
  if (!key || !card) return;
  queueWrite(card.getAttribute("data-id"), key, t.value, delay);
}
cardsEl.addEventListener("input", function (e) {
  if (e.target.type === "radio") return;
  handleField(e, 500);
});
cardsEl.addEventListener("change", function (e) {
  if (e.target.type === "radio") handleField(e, 0);
});

cardsEl.addEventListener("click", async function (e) {
  var btn = e.target.closest("[data-remove]");
  if (!btn) return;
  var id = btn.closest(".college").getAttribute("data-id");
  var c = findCollege(id);
  var label = c && c.name ? c.name : "this college";
  if (!window.confirm("Remove " + label + " from the shared list? This removes it for everyone.")) return;
  clearTimeout(pending[id] && pending[id].timer);
  delete pending[id];
  try { await deleteDoc(doc(db, "colleges", id)); }
  catch (err) { say("Couldn’t remove that college. Check your connection."); }
});

$("add").addEventListener("click", async function () {
  setView("edit");
  var ref = doc(collection(db, "colleges"));
  focusAfterAdd = ref.id;
  var data = blankFields();
  data.created = Date.now();
  try { await setDoc(ref, data); }
  catch (e) { say("Couldn’t add a college. Check your connection."); }
});

/* ---------- Tabs, CSV, print, sign out ---------- */

var tabEdit = $("tab-edit"), tabCompare = $("tab-compare");
function setView(v) {
  currentView = v;
  var edit = v === "edit";
  tabEdit.setAttribute("aria-selected", edit);
  tabCompare.setAttribute("aria-selected", !edit);
  $("view-edit").hidden = !edit;
  $("view-compare").hidden = edit;
  if (!edit) renderCompare();
  window.scrollTo(0, 0);
}
tabEdit.addEventListener("click", function () { setView("edit"); });
tabCompare.addEventListener("click", function () { setView("compare"); });

function csvCell(v) { return '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"'; }
$("csv").addEventListener("click", function () {
  var lines = [FIELDS.map(function (f) { return csvCell(f.label); }).join(",")];
  colleges.forEach(function (c) {
    lines.push(FIELDS.map(function (f) { return csvCell(c[f.key]); }).join(","));
  });
  var blob = new Blob(["\ufeff" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "college-comparison.csv";
  document.body.appendChild(a);
  a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
});

$("print").addEventListener("click", function () {
  setView("edit");
  window.print();
});

$("signout").addEventListener("click", function () { signOut(auth); });

/* ---------- Start ---------- */

function startListening(user) {
  $("signout").title = "Signed in as " + user.email;
  var q = query(collection(db, "colleges"), orderBy("created"));
  unsub = onSnapshot(q, function (snap) {
    colleges = snap.docs.map(function (d) {
      var o = blankFields();
      var data = d.data();
      FIELDS.forEach(function (f) { if (typeof data[f.key] === "string") o[f.key] = data[f.key]; });
      o.id = d.id;
      return o;
    });
    openApp();
    syncCards();
    if (currentView === "compare") renderCompare();
  }, function (err) {
    if (err && err.code === "permission-denied") showGate(deniedHtml(user.email));
    else showGate(errorHtml("The worksheet couldn’t load. Check your connection and try again."));
  });
}

var configured = !Object.keys(firebaseConfig).some(function (k) { return String(firebaseConfig[k]).indexOf("PASTE") !== -1; });

if (!configured) {
  showGate(setupHtml);
} else {
  var app = initializeApp(firebaseConfig);
  auth = getAuth(app);
  try {
    db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });
  } catch (e) {
    db = getFirestore(app);
  }
  onAuthStateChanged(auth, function (user) {
    if (unsub) { unsub(); unsub = null; }
    colleges = [];
    cardsEl.innerHTML = "";
    if (!user) { showGate(signedOutHtml()); return; }
    showGate("<p>Loading…</p>");
    startListening(user);
  });
}
</script>
</body>
</html>
