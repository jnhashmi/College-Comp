<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>College comparison worksheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #12233a;
    --ink-soft: #4a5b70;
    --paper: #f3f7fa;
    --card: #ffffff;
    --line: #cfdae4;
    --sea: #0d7c8f;
    --sea-deep: #095a69;
    --sea-wash: #dff1f4;
    --sun: #f2a93b;
    --danger: #b3261e;
    --radius: 10px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #e6eef6;
      --ink-soft: #a3b3c4;
      --paper: #0e1824;
      --card: #162435;
      --line: #2c4157;
      --sea: #4fc3d6;
      --sea-deep: #8fdbe8;
      --sea-wash: #17384a;
      --sun: #f2b75c;
      --danger: #ff8a80;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --ink: #e6eef6;
    --ink-soft: #a3b3c4;
    --paper: #0e1824;
    --card: #162435;
    --line: #2c4157;
    --sea: #4fc3d6;
    --sea-deep: #8fdbe8;
    --sea-wash: #17384a;
    --sun: #f2b75c;
    --danger: #ff8a80;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { background: var(--paper); }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 17px;
    line-height: 1.5;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  h1, h2 {
    font-family: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
  }
  header.top {
    background: var(--sea-deep);
    color: #fff;
    padding: 1.4rem 1.25rem 3.6rem;
    position: relative;
    overflow: hidden;
  }
  header.top::after {
    content: "";
    position: absolute; left: 0; right: 0; bottom: -1px; height: 44px;
    background:
      radial-gradient(60px 22px at 30px 44px, var(--paper) 98%, transparent 100%) 0 0 / 120px 44px repeat-x,
      radial-gradient(60px 22px at 90px 44px, var(--paper) 98%, transparent 100%) 0 0 / 120px 44px repeat-x;
    opacity: 1;
  }
  .wrap { max-width: 1100px; margin: 0 auto; }
  header.top h1 { font-size: clamp(1.35rem, 3.2vw, 1.8rem); line-height: 1.15; }
  .toolbar {
    position: sticky; top: 0; z-index: 5;
    background: color-mix(in srgb, var(--paper) 92%, transparent);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--line);
    padding: .6rem 1.25rem;
    padding-top: calc(.6rem + env(safe-area-inset-top, 0px));
  }
  .toolbar .wrap { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; justify-content: space-between; }
  .tabs { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--card); }
  .tabs button {
    border: 0; background: transparent; color: var(--ink-soft);
    font: inherit; font-weight: 600; padding: .45rem 1.1rem; cursor: pointer;
  }
  .tabs button[aria-selected="true"] { background: var(--sea); color: #fff; }
  .actions { display: flex; flex-wrap: wrap; gap: .4rem; }
  .btn {
    font: inherit; font-weight: 600; cursor: pointer;
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    padding: .42rem .9rem; border-radius: 8px;
  }
  .btn:hover { border-color: var(--sea); }
  .btn.primary { background: var(--sea); border-color: var(--sea); color: #fff; }
  .btn.primary:hover { background: var(--sea-deep); }
  .btn.danger { color: var(--danger); }
  .btn.link {
    border: 0; background: none; padding: .42rem .3rem;
    color: var(--sea-deep); text-decoration: underline; text-underline-offset: 3px;
  }
  .btn.link:hover { color: var(--sea); }
  .actions { align-items: center; gap: .4rem .9rem; }
  :focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }

  main { margin-top: -2.2rem; padding: 0 1.25rem 4rem; position: relative; }
  .saved { font-size: .9rem; color: var(--ink-soft); margin: 1rem 0 0; min-height: 1.4em; }

  .college {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 1.25rem;
    margin: 1.1rem 0;
    box-shadow: 0 1px 0 var(--line);
  }
  .college-head { display: flex; gap: .75rem; align-items: flex-end; justify-content: space-between; margin-bottom: 1rem; }
  .college-head .name-field { flex: 1; }
  .grid { display: grid; gap: 1rem 1.25rem; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
  .span-2 { grid-column: 1 / -1; }
  fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
  label, legend { display: block; font-weight: 600; font-size: .95rem; margin-bottom: .3rem; padding: 0; }
  .hint { font-weight: 400; color: var(--ink-soft); font-size: .88rem; }
  input[type="text"], input[type="date"], textarea {
    width: 100%; font: inherit; color: var(--ink);
    background: var(--paper); border: 1px solid var(--line); border-radius: 8px;
    padding: .5rem .65rem;
  }
  textarea { resize: vertical; min-height: 5.2rem; }
  input[type="text"]:focus, input[type="date"]:focus, textarea:focus { border-color: var(--sea); outline: 3px solid var(--sea-wash); }
  .name-field input { font-family: "Bricolage Grotesque", system-ui, sans-serif; font-weight: 700; font-size: 1.35rem; }

  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--paper); }
  .seg label { margin: 0; font-weight: 600; position: relative; }
  .seg input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
  .seg span { display: block; padding: .42rem .9rem; color: var(--ink-soft); }
  .seg label + label span { border-left: 1px solid var(--line); }
  .seg input:checked + span { background: var(--sea); color: #fff; }
  .seg input[data-diff="Hard"]:checked + span { background: var(--sun); color: #3a2400; }
  .seg input:focus-visible + span { outline: 3px solid var(--sun); outline-offset: -3px; }

  .empty { text-align: center; padding: 3rem 1rem; color: var(--ink-soft); }

  .table-scroll { overflow-x: auto; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); margin-top: 1.1rem; }
  table { border-collapse: collapse; width: 100%; min-width: 980px; font-size: .95rem; }
  th, td { text-align: left; vertical-align: top; padding: .6rem .75rem; border-bottom: 1px solid var(--line); }
  th { font-family: "Bricolage Grotesque", system-ui, sans-serif; font-size: .9rem; background: var(--sea-wash); color: var(--ink); position: sticky; top: 0; }
  td:first-child, th:first-child { position: sticky; left: 0; background: var(--card); font-weight: 600; border-right: 1px solid var(--line); }
  th:first-child { background: var(--sea-wash); }
  td.long { min-width: 190px; white-space: pre-wrap; }
  th:nth-child(2), td:nth-child(2) { width: 5.1rem; min-width: 5.1rem; max-width: 5.1rem; }
  .pill { display: inline-block; padding: 0 .55rem; border-radius: 999px; font-weight: 600; font-size: .85rem; background: var(--sea-wash); color: var(--sea-deep); }
  .pill.hard { background: var(--sun); color: #3a2400; }
  .muted { color: var(--ink-soft); }

  [hidden] { display: none !important; }

  @media print {
    header.top::after, .toolbar, .saved, .btn { display: none !important; }
    header.top { background: none; color: #000; padding: 0 0 1rem; }
    header.top p { color: #333; }
    main { margin-top: 0; }
    body { background: #fff; color: #000; font-size: 12px; }
    .college { break-inside: avoid; box-shadow: none; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .btn, .tabs button { transition: background-color .15s, border-color .15s; }
  }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <h1>College comparison worksheet</h1>
  </div>
</header>

<div class="toolbar">
  <div class="wrap">
    <div class="tabs" role="tablist" aria-label="Views">
      <button role="tab" id="tab-compare" aria-selected="true" aria-controls="view-compare">Compare</button>
      <button role="tab" id="tab-edit" aria-selected="false" aria-controls="view-edit">Fill in</button>
    </div>
    <div class="actions">
      <button class="btn primary" id="add">Add college</button>
      <button class="btn link" id="csv">Download CSV</button>
      <button class="btn link" id="backup">Save backup</button>
      <button class="btn link" id="restore">Open backup</button>
      <button class="btn link" id="print">Print</button>
      <input type="file" id="file" accept="application/json,.json" hidden>
    </div>
  </div>
</div>

<main>
  <div class="wrap">
    <p class="saved" id="status" role="status" aria-live="polite"></p>

    <section id="view-compare" role="tabpanel" aria-labelledby="tab-compare">
      <div id="compare"></div>
    </section>

    <section id="view-edit" role="tabpanel" aria-labelledby="tab-edit" hidden>
      <div id="cards"></div>
    </section>
  </div>
</main>

<script>
(function () {
  "use strict";

  var STORE_KEY = "college-comparison-v1";

  var FIELDS = [
    { key: "name",    label: "College name" },
    { key: "type",    label: "4-yr / 2-yr" },
    { key: "local",   label: "LA local" },
    { key: "ocean",   label: "Near ocean" },
    { key: "diff",    label: "App difficulty" },
    { key: "due",     label: "App due" },
    { key: "major",   label: "Must declare major" },
    { key: "support", label: "Social / emotional / executive function support" },
    { key: "cost",    label: "Cost & merit aid available" },
    { key: "housing", label: "Housing" },
    { key: "notes",   label: "Campus culture and vibe; notes" }
  ];

  var colleges = load();
  var statusTimer = null;

  function blank() {
    var o = { id: String(Date.now()) + Math.random().toString(36).slice(2, 7) };
    FIELDS.forEach(function (f) { o[f.key] = ""; });
    return o;
  }

  function load() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (raw) {
        var data = JSON.parse(raw);
        if (Array.isArray(data) && data.length) return data;
      }
    } catch (e) {}
    return [blank()];
  }

  function save() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(colleges));
      say("Saved in this browser");
    } catch (e) {
      say("Couldn’t save automatically. Use Save backup to keep your work.");
    }
  }

  function say(msg) {
    var el = document.getElementById("status");
    el.textContent = msg;
    clearTimeout(statusTimer);
    statusTimer = setTimeout(function () { el.textContent = ""; }, 2500);
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function seg(id, key, options, current, extraAttr) {
    return '<div class="seg">' + options.map(function (opt) {
      var val = typeof opt === "string" ? opt : opt[0];
      var text = typeof opt === "string" ? opt : opt[1];
      return '<label><input type="radio" name="' + esc(key + "-" + id) + '" data-key="' + key + '" value="' + esc(val) + '"' +
        (extraAttr ? ' data-diff="' + esc(val) + '"' : "") +
        (current === val ? " checked" : "") + '><span>' + esc(text) + '</span></label>';
    }).join("") + "</div>";
  }

  function cardHtml(c, i) {
    var id = c.id;
    return '' +
    '<article class="college" data-id="' + esc(id) + '" aria-label="College ' + (i + 1) + '">' +
      '<div class="college-head">' +
        '<div class="name-field"><label for="name-' + esc(id) + '">College name</label>' +
        '<input type="text" id="name-' + esc(id) + '" data-key="name" value="' + esc(c.name) + '" placeholder="e.g. Loyola Marymount"></div>' +
        '<button class="btn danger" data-remove aria-label="Remove this college">Remove</button>' +
      '</div>' +
      '<div class="grid">' +
        '<fieldset><legend>4-year or 2-year</legend>' + seg(id, "type", ["4-yr", "2-yr"], c.type) + '</fieldset>' +
        '<fieldset><legend>LA local</legend>' + seg(id, "local", [["Y", "Yes"], ["N", "No"]], c.local) + '</fieldset>' +
        '<fieldset><legend>Near ocean</legend>' + seg(id, "ocean", [["Y", "Yes"], ["N", "No"]], c.ocean) + '</fieldset>' +
        '<fieldset><legend>Application difficulty</legend>' + seg(id, "diff", [["Easy", "Easy"], ["Med", "Medium"], ["Hard", "Hard"]], c.diff, true) + '</fieldset>' +
        '<div><label for="due-' + esc(id) + '">Application due</label>' +
          '<input type="date" id="due-' + esc(id) + '" data-key="due" value="' + esc(c.due) + '"></div>' +
        '<fieldset><legend>Must declare a major</legend>' + seg(id, "major", [["Y", "Yes"], ["N", "No"]], c.major) + '</fieldset>' +
        '<div class="span-2"><label for="support-' + esc(id) + '">Social, emotional &amp; executive function support</label>' +
          '<textarea id="support-' + esc(id) + '" data-key="support" placeholder="Advising, coaching, counseling, learning center…">' + esc(c.support) + '</textarea></div>' +
        '<div><label for="cost-' + esc(id) + '">Cost &amp; merit aid available</label>' +
          '<textarea id="cost-' + esc(id) + '" data-key="cost" placeholder="Tuition, scholarships, aid estimate…">' + esc(c.cost) + '</textarea></div>' +
        '<div><label for="housing-' + esc(id) + '">Housing</label>' +
          '<textarea id="housing-' + esc(id) + '" data-key="housing" placeholder="Dorm options, guaranteed years, off-campus…">' + esc(c.housing) + '</textarea></div>' +
        '<div class="span-2"><label for="notes-' + esc(id) + '">Campus culture and vibe; notes</label>' +
          '<textarea id="notes-' + esc(id) + '" data-key="notes" placeholder="How did it feel? Who did you meet? What stood out?">' + esc(c.notes) + '</textarea></div>' +
      '</div>' +
    '</article>';
  }

  function renderCards() {
    var el = document.getElementById("cards");
    if (!colleges.length) {
      el.innerHTML = '<div class="empty">No colleges yet. Choose Add college to start your list.</div>';
      return;
    }
    el.innerHTML = colleges.map(cardHtml).join("");
  }

  function yn(v) { return v === "Y" ? "Yes" : v === "N" ? "No" : '<span class="muted">–</span>'; }

  function fmtDate(v) {
    if (!v) return '<span class="muted">–</span>';
    var p = v.split("-");
    if (p.length !== 3) return esc(v);
    var d = new Date(+p[0], +p[1] - 1, +p[2]);
    return esc(d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }));
  }

  function txt(v) { return v ? esc(v) : '<span class="muted">–</span>'; }

  function renderCompare() {
    var el = document.getElementById("compare");
    if (!colleges.length) {
      el.innerHTML = '<div class="empty">Add a college on the Fill in tab to compare.</div>';
      return;
    }
    var head = '<tr>' + FIELDS.map(function (f) { return '<th scope="col">' + esc(f.label) + '</th>'; }).join("") + '</tr>';
    var rows = colleges.map(function (c) {
      var diff = c.diff ? '<span class="pill' + (c.diff === "Hard" ? " hard" : "") + '">' + esc(c.diff === "Med" ? "Medium" : c.diff) + '</span>' : '<span class="muted">–</span>';
      return '<tr>' +
        '<th scope="row" style="font-weight:600;background:var(--card);font-family:inherit;font-size:inherit">' + (c.name ? esc(c.name) : '<span class="muted">Untitled</span>') + '</th>' +
        '<td>' + (c.type ? esc(c.type) : '<span class="muted">–</span>') + '</td>' +
        '<td>' + yn(c.local) + '</td>' +
        '<td>' + yn(c.ocean) + '</td>' +
        '<td>' + diff + '</td>' +
        '<td>' + fmtDate(c.due) + '</td>' +
        '<td>' + yn(c.major) + '</td>' +
        '<td class="long">' + txt(c.support) + '</td>' +
        '<td class="long">' + txt(c.cost) + '</td>' +
        '<td class="long">' + txt(c.housing) + '</td>' +
        '<td class="long">' + txt(c.notes) + '</td>' +
      '</tr>';
    }).join("");
    el.innerHTML = '<div class="table-scroll"><table><caption class="muted" style="text-align:left;padding:.6rem .75rem;caption-side:bottom">Edit details on the Fill in tab.</caption><thead>' + head + '</thead><tbody>' + rows + '</tbody></table></div>';
  }

  /* ---- Events ---- */

  var cardsEl = document.getElementById("cards");

  function onFieldChange(e) {
    var t = e.target;
    var key = t.getAttribute("data-key");
    if (!key) return;
    var card = t.closest(".college");
    if (!card) return;
    var c = colleges.filter(function (x) { return x.id === card.getAttribute("data-id"); })[0];
    if (!c) return;
    c[key] = t.value;
    save();
  }
  cardsEl.addEventListener("input", function (e) {
    if (e.target.type === "radio") return;
    onFieldChange(e);
  });
  cardsEl.addEventListener("change", function (e) {
    if (e.target.type === "radio") onFieldChange(e);
  });
  cardsEl.addEventListener("click", function (e) {
    var btn = e.target.closest("[data-remove]");
    if (!btn) return;
    var card = btn.closest(".college");
    var id = card.getAttribute("data-id");
    var c = colleges.filter(function (x) { return x.id === id; })[0];
    var label = c && c.name ? c.name : "this college";
    if (!window.confirm("Remove " + label + " from your list?")) return;
    colleges = colleges.filter(function (x) { return x.id !== id; });
    save();
    renderCards();
  });

  document.getElementById("add").addEventListener("click", function () {
    setView("edit");
    var c = blank();
    colleges.push(c);
    save();
    renderCards();
    var input = document.getElementById("name-" + c.id);
    if (input) { input.scrollIntoView({ block: "center" }); input.focus(); }
  });

  /* ---- Tabs ---- */

  var tabEdit = document.getElementById("tab-edit");
  var tabCompare = document.getElementById("tab-compare");
  function setView(v) {
    var edit = v === "edit";
    tabEdit.setAttribute("aria-selected", edit);
    tabCompare.setAttribute("aria-selected", !edit);
    document.getElementById("view-edit").hidden = !edit;
    document.getElementById("view-compare").hidden = edit;
    if (!edit) renderCompare();
    window.scrollTo(0, 0);
  }
  tabEdit.addEventListener("click", function () { setView("edit"); });
  tabCompare.addEventListener("click", function () { setView("compare"); });

  /* ---- Export / import / print ---- */

  function download(name, mime, content) {
    var blob = new Blob([content], { type: mime });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }

  function csvCell(v) { return '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"'; }

  document.getElementById("csv").addEventListener("click", function () {
    var lines = [FIELDS.map(function (f) { return csvCell(f.label); }).join(",")];
    colleges.forEach(function (c) {
      lines.push(FIELDS.map(function (f) { return csvCell(c[f.key]); }).join(","));
    });
    download("college-comparison.csv", "text/csv;charset=utf-8", "\ufeff" + lines.join("\r\n"));
  });

  document.getElementById("backup").addEventListener("click", function () {
    download("college-comparison-backup.json", "application/json", JSON.stringify(colleges, null, 2));
  });

  var fileInput = document.getElementById("file");
  document.getElementById("restore").addEventListener("click", function () { fileInput.click(); });
  fileInput.addEventListener("change", function () {
    var f = fileInput.files && fileInput.files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var data = JSON.parse(r.result);
        if (!Array.isArray(data)) throw new Error("bad");
        if (!window.confirm("Replace your current list with the " + data.length + " college(s) in this backup?")) return;
        colleges = data.map(function (d) {
          var o = blank();
          FIELDS.forEach(function (fl) { if (typeof d[fl.key] === "string") o[fl.key] = d[fl.key]; });
          return o;
        });
        if (!colleges.length) colleges = [blank()];
        save();
        renderCards();
        setView("edit");
      } catch (e) {
        window.alert("That file isn’t a college worksheet backup. Choose a .json file saved with Save backup.");
      }
      fileInput.value = "";
    };
    r.readAsText(f);
  });

  document.getElementById("print").addEventListener("click", function () {
    setView("edit");
    window.print();
  });

  renderCards();
  renderCompare();
})();
</script>
</body>
</html>
